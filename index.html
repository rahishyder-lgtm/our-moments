<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love</title>
    <style>
        body {
            background-color: #fdf2f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #5a2a2a;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(219, 112, 147, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h2 {
            color: #d81b60;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            margin-bottom: 20px;
        }
        .heart-btn {
            background-color: #d81b60;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .heart-btn:hover {
            background-color: #ad1457;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2>You are my favourite person.</h2>
        <p>Someone made this, just for you ❤️</p>
        <button class="heart-btn" onclick="openGift()">Open Your Gift ➔</button>
    </div>

    <script>
        function openGift() {
            document.getElementById('mainCard').innerHTML = `
                <h2>Forever Yours ✨</h2>
                <p>This little surprise is filled with all my love, just for you!</p>
                <p style="font-size: 24px;">💖 🥰 🌹</p>
            `;
        }
    </script>

</body>
</html>
